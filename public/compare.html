<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Before and after</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #111; color: #eee; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; background: #1b1b1b; border-bottom: 1px solid #333; }
  header button { padding: 7px 12px; border: 1px solid #444; border-radius: 999px; background: #222; color: #ddd; font: 600 13px system-ui; cursor: pointer; }
  header button:hover { border-color: #888; }
  header button.on { background: #eee; color: #111; border-color: #eee; }
  header .new { color: #7fe3a0; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid #333; }
  .pane:last-child { border-right: 0; }
  .label { padding: 8px 12px; font: 700 13px system-ui; background: #181818; border-bottom: 1px solid #333; }
  .label small { font-weight: 400; color: #999; margin-left: 8px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header id="nav"></header>
<main>
  <section class="pane"><div class="label">BEFORE <small>restored site, port 5199</small></div><iframe id="a" title="Before"></iframe></section>
  <section class="pane"><div class="label">AFTER <small>draft rewrite, port 5200</small></div><iframe id="b" title="After"></iframe></section>
</main>
<script>
  const pages = [
    ["Home", "/"], ["About", "/about"], ["Projects", "/projects"],
    ["CallPilot", "/projects/callpilot"], ["AlphaBrief", "/projects/alphabrief"],
    ["Mario SDK (new)", "/projects/mario-sdk", true],
    ["Distributed Chat", "/projects/chat"], ["Agent Release Lab", "/projects/agent-release-lab"],
    ["Invoice Review", "/projects/invoice-review"], ["Inventory Ops", "/projects/inventory-ops"],
    ["QuoteAtlas", "/projects/quoteatlas"], ["Blog", "/blog"], ["Resume", "/resume"], ["Contact", "/contact"],
  ];
  const host = location.hostname || "localhost";
  const A = `http://${host}:5199`, B = `http://${host}:5200`;
  const nav = document.getElementById("nav");
  function go(path) {
    document.getElementById("a").src = A + path;
    document.getElementById("b").src = B + path;
    history.replaceState(null, "", "#" + path);
    [...nav.children].forEach((b) => b.classList.toggle("on", b.dataset.path === path));
  }
  pages.forEach(([label, path, isNew]) => {
    const b = document.createElement("button");
    b.textContent = label; b.dataset.path = path; if (isNew) b.className = "new";
    b.onclick = () => go(path);
    nav.appendChild(b);
  });
  go(location.hash.slice(1) || "/projects/callpilot");
</script>
</body>
</html>
